services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

  backend:
    image: php:8.4-apache
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html

volumes:
  frontend_node_modules:
